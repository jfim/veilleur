name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veilleur
          POSTGRES_PASSWORD: veilleur
          POSTGRES_DB: veilleur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veilleur"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://veilleur:veilleur@localhost:5432/veilleur
      VEILLEUR_DATABASE_URL: postgresql+psycopg://veilleur:veilleur@localhost:5432/veilleur

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test
