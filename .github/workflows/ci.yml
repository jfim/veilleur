name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veilleur
          POSTGRES_PASSWORD: veilleur
          POSTGRES_DB: veilleur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veilleur"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      passe-partout:
        image: ghcr.io/jfim/passe-partout:0.3
        ports:
          - 8000:8000
        options: >-
          --shm-size=2g

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: veilleur
      POSTGRES_PASSWORD: veilleur
      POSTGRES_DB: veilleur
      PASSEPARTOUT_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: just lint

      - name: Typecheck
        run: just typecheck

      - name: Apply migrations
        run: just db-upgrade

      - name: Alembic check (no schema drift)
        run: just db-check

      - name: Test
        run: just test

      - name: Wait for passe-partout
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "passe-partout ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "passe-partout did not become ready in 60s"
          exit 1

      - name: Integration tests
        run: uv run pytest -m "integration and not live" -s
