[project]
name = "veilleur"
version = "0.1.0"
description = "Monitor webpages and turn them into RSS/Atom feeds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "psycopg[binary]",
    "asyncpg",
    "alembic",
    "lxml",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "feedgen",
    "uuid-utils",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.27",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "hypothesis>=6.152.4",
    "testcontainers[postgres]",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veilleur"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` in argument defaults is the standard idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Verbatim prompt template from rss-ify must not be reflowed.
"veilleur/xpath/derive.py" = ["E501"]

[tool.pyright]
include = ["veilleur", "tests"]
exclude = ["alembic/versions"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# lxml ships no type stubs; relax untyped-import diagnostics.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests that hit a real LLM endpoint (deselect with '-m \"not live\"')",
    "integration: marks tests that hit a real passe-partout (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not live and not integration'"
