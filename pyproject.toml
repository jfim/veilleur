[project]
name = "veilleur"
version = "0.1.0"
description = "Monitor webpages and turn them into RSS/Atom feeds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "psycopg[binary]",
    "asyncpg",
    "alembic",
    "lxml",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "feedgen",
    "uuid-utils",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "hypothesis>=6.152.4",
    "testcontainers[postgres]",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veilleur"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` in argument defaults is the standard idiom.
ignore = ["B008"]

[tool.pyright]
include = ["veilleur", "tests"]
exclude = ["alembic/versions"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
